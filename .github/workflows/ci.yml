name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: kreasikita_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      DATABASE_URL: mysql://root:ci-password@127.0.0.1:3306/kreasikita_ci
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: ci-password
      DATABASE_NAME: kreasikita_ci
      DATABASE_CONNECTION_LIMIT: 5
      BETTER_AUTH_SECRET: ci-better-auth-secret-at-least-thirty-two-characters
      MIDTRANS_SERVER_KEY: ci-midtrans-server-key
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ci-midtrans-client-key
      MIDTRANS_IS_PRODUCTION: "false"
      CRON_SECRET: ci-cron-secret-at-least-thirty-two-characters-long
      ADMIN_BOOTSTRAP_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Seed test catalog
        run: npm run db:seed

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
